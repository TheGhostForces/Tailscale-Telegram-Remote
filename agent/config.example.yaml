# Конфигурация агента. Скопируйте в config.yaml.
# Секрет НЕ хранится здесь: он в файле .env (AGENT_SECRET=...), его выдаёт `rcctl add` или создаёт установщик.

bind: auto          # auto = адрес интерфейса Tailscale (100.64.0.0/10); либо явный IP
port: 8765

# Нужно только если этот компьютер будит другие по LAN (wake.mode: via).
wol_broadcast: "255.255.255.255"   # широковещательный адрес LAN (или 192.168.0.255)
wol_port: 9
# Необязательный белый список MAC для /wake. Если не задан, будится любой MAC из подписанного запроса бота.
# devices:
#   - name: laptop
#     mac: "AA:BB:CC:DD:EE:02"

# Разрешённые команды для /run (без shell, только список аргументов).
commands: {}
#  Windows-пример:
#    notepad: ["notepad.exe"]
#  Linux-пример:
#    updates: ["apt", "list", "--upgradable"]

log_file: agent.log
rate_limit_per_minute: 30
