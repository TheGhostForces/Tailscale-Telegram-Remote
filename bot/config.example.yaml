# Общие настройки бота. Скопируйте в config.yaml.
# Список устройств здесь НЕ хранится: им управляет утилита `rcctl` (файл devices.yaml),
# бот подхватывает изменения сам, перезапуск не нужен. См. docs/DEVICES.md.

confirm_actions: [sleep, reboot, shutdown]   # требуют кнопку + TOTP (/run требует всегда)
wake_wait_seconds: 120
monitor_interval_seconds: 30
log_file: bot.log
