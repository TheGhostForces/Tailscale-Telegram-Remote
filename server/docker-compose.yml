# Self-hosted RustDesk (hbbs = сервер ID/rendezvous, hbbr = relay).
# Запуск: RUSTDESK_HOST=ваш.домен.или.IP docker compose up -d
# Публичный ключ: ./data/id_ed25519.pub  (его вводят в клиентах RustDesk)
services:
  hbbs:
    image: rustdesk/rustdesk-server:latest   # после проверки лучше закрепить версию
    command: hbbs -r ${RUSTDESK_HOST:?set RUSTDESK_HOST}:21117 -k _
    network_mode: host
    volumes:
      - ./data:/root
    depends_on: [hbbr]
    restart: unless-stopped
  hbbr:
    image: rustdesk/rustdesk-server:latest
    command: hbbr -k _
    network_mode: host
    volumes:
      - ./data:/root
    restart: unless-stopped
